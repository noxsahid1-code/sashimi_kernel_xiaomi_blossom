name: Build Kernel

on:
  workflow_dispatch: # Manual build trigger ke liye
  push:
    branches:
      - sashimi
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04 # 20.04 deprecated hai, isliye 22.04 use kar rahe hain

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # g++-multilib aur gcc-multilib hata diya gaya hai kyunki yeh cross-compiler se conflict karte hain
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Clone Toolchain (Proton Clang)
      run: |
        # Agar koi aur toolchain chahiye toh yahan URL change kar sakte ho
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/clang/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        # IMPORTANT: Yahan apna sahi defconfig naam daalo. 
        # Check karo 'arch/arm64/configs/' folder me. Agar 'vendor/blossom_defconfig' hai toh woh likho.
        make O=out ARCH=arm64 blossom_defconfig
        
        # Kernel Compile command
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        # Agar 'Image.gz' banti hai toh yahan 'Image.gz-dtb' ki jagah 'Image.gz' kar dena
        path: out/arch/arm64/boot/Image.gz
